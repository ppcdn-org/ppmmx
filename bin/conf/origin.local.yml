###############################################
# mmx origin node configuration
# 源节点：接受 WHIP 推流，提供 WHEP 回源
###############################################

logLevel: info
logDestinations: [stdout, file]
logFile: logs/mmx-origin.log

# ── PPCDN control plane ───────────────────────
mmxControl: true
mmxControlURL: ws://127.0.0.1:18000/ws/mmx
mmxNodeRole: NODE_ROLE_ORIGIN
mmxNodeRegion: local
mmxNodeCapacity: 100
mmxHeartbeatInterval: 10s
mmxWebRTCBaseURL: http://127.0.0.1:8889
# origin 上下线时，ppcenter 会把这个地址转发给已注册的 NODE_ROLE_PUBLISHER
# 节点(ppcenter internal/manager/node_manager.go 的 notifyPublishersOriginStatus)。
# 不填就跳过通知(打 WARN "empty publishUrl")；跟实际签发 WHIP 地址的
# /v1/publish/requests 流程无关，那边走的是 mmxWebRTCBaseURL。本地目前没有
# NODE_ROLE_PUBLISHER 节点注册，填了也暂时没人接收，先跟 mmxWebRTCBaseURL
# 保持一致。
mmxPublishURL: http://127.0.0.1:8889

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512
udpReadBufferSize: 2097152            # UDP 读缓冲 2MB，避免大关键帧 burst 丢包

# ── Control API ──────────────────────────────
api: true
apiAddress: :9997

# ── Admin 管理界面 ────────────────────────
# 不设则默认 :8080，本机该端口已被 Apache (httpd.exe) 占用。
# Windows 上 Go 绑的是 IPv6 通配 [::]:8080，不会报错，但访问
# http://127.0.0.1:8080 会落到 Apache 而不是 mmx。
adminAddress: :8081
# adminName 决定 admin store 的 sqlite 文件名(data/<adminName>.db3)。不设则
# 默认落到 "origin"——这里显式写出来，纯粹是为了跟 edge/record 保持对称、
# 防止以后改了默认值反而误伤；真正踩过的坑见 edge.local.yml 的同一处注释。
adminName: origin

# ── Protocols ─────────────────────────────────
rtsp: false
# RTMP 已关闭：不再接收 OBS Enhanced Broadcasting (Multitrack Video) 推流。
rtmp: false
hls: false
srt: true
srtAddress: :7890
# 丢包率超过 srtLossAlarmThresholdPct(默认 10%)时上报告警到 ppcenter(需要
# mmxControl 开启);srtLossDisconnectEnable 打开后,持续超阈值满
# srtLossDisconnectSec(默认 120s)会主动断开该路 SRT 连接,逼 OBS 重新推流。
# 两个 Enable 默认都是 false,按需单独打开。
srtLossAlarmEnable: false
srtLossAlarmThresholdPct: 10.0
srtLossDisconnectEnable: false
srtLossDisconnectSec: 120
# SRT-simulcast degrade：与下面 webrtcDegrade* 共用同一套 FSM/WS 通道
# (internal/degrade)，密钥/路径复用 webrtcDegradeWSPathSuffix + .env 的
# WHIP_WS_SECRET，这里只单独配阈值。
srtDegradeEnable: true
srtDegradeInstantLossPct: 5.0
srtDegradeAvgLossPct: 1.0
# Recover* < Degrade*，同上 webrtcRecover* 的 gap/防抖动理由。
srtRecoverInstantLossPct: 2.0
srtRecoverAvgLossPct: 0.5
srtDegradeObservationSec: 60
moq: false

# ── WebRTC ────────────────────────────────────
webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189           # 固定 ICE UDP，才能设置缓冲区大小
webrtcAllowOrigins: ["*"]
# Simulcast 推流端(如 OBS)冷启动时视频编码器可能晚于音频出包;
# 默认 2s 窗口过短会导致只采集到音频(播放黑屏)。轨道齐了会提前返回。
webrtcTrackGatherTimeout: 10s
# origin 是推流端(OBS/ppobs)直接落地的第一跳，网络抖动/乱序最明显，把入站
# RTP 包重排缓冲从默认的 64 个包提到 128 个，减少因缓冲过小误判丢包。edge/
# record 只接收 mmx 间转发(已经过 origin 整理)的流，不需要调大，维持默认。
webrtcInboundRTPBufferSize: 128

# ABR (Adaptive Bitrate)
webrtcABREnable: true
webrtcABRWSPath: /ws/control
webrtcABRSwitchCooldown: 3000

# WHIP degrade protocol (docs/obs-mmx-degrade-protocol.md). Secret comes
# from .env (WHIP_WS_SECRET), not from this file.
# Recover* < Degrade* 留出一个 gap(死区)：丢包率在两者之间时不升不降，
# 避免在单一阈值附近来回抖动(反复升降级)。两者相等则等价于旧的单阈值行为。
webrtcDegradeEnable: true
webrtcDegradeWSPathSuffix: /ws/whip
webrtcDegradeInstantLossPct: 5.0
webrtcDegradeAvgLossPct: 1.0
webrtcRecoverInstantLossPct: 2.0
webrtcRecoverAvgLossPct: 0.5
webrtcDegradeObservationSec: 60

# ── Forward (腾讯云 WHIP 转推) ──────────────────
# 默认关闭。开启前必须在下面填好账号级信息，且每条要转推的 path
# 还要单独设置 forwardTencent: true (见下方 paths 示例)。
# 见 doc/forward-tencent-design.md —— WHIP 地址的确切拼装方式和多层
# stream key 命名规则还没有对照真实腾讯云账号验证过，先用默认模板试。
tencentWHIPEnable: false
tencentWHIPEndpoint: "webrtc://{domain}/{app}/{streamKey}?txSecret={txSecret}&txTime={txTime}"
tencentWHIPDomain: example.invalid
tencentWHIPApp: live
tencentWHIPSecretKey: ""
tencentWHIPTokenDays: 30

# ── Forward (mmx-to-mmx 转推) ──────────────────
# 账号级总开关；每条要转推的 path 还要单独设置 forwardMmx: true 并在
# forwardMmxTargets 里列出目标节点(见下方 paths 示例)。
#
# token 不写在本文件里：所有转发目标都是自己的节点、共用同一个预共享密钥，
# 所以统一取 .env 的 MMX_FORWARD_SECRET(见 conf.Path.validate)，避免密钥进
# 版本库。本节点的 MMX_FORWARD_SECRET 必须和每个目标节点的完全一致。该密钥
# 与 WHIP_AUTH_KEY/WHIP_WS_SECRET 相互独立，不要复用(见
# docs/obs-whip-publish-auth-protocol.md 第八节)。
forwardMmxEnable: true

# ── Paths ─────────────────────────────────────
paths:
  all:                          # 接受任意路径的推流
    source: publisher
    sourceOnDemand: false
    maxReaders: 30              # WHEP 拉流最大并发数，0=不限制
    forwardTencent: false                      # 该 path 是否转推腾讯云
    # forwardTencentStreamKey: my-stream-name    # 留空则默认用 path 名

    # 本地联调：同时转推给 record 和 edge 两个节点(见上方 forwardMmxEnable)。
    # {path} 会被替换成实际的推流路径名，让 "all" 通配的每条流各自转发到
    # 目标节点上同名的 path，不会互相覆盖。
    forwardMmx: true
    forwardMmxTargets:
      - url: http://127.0.0.1:8893/{path}/whip   # record (webrtcAddress :8893)
      - url: http://127.0.0.1:8890/{path}/whip   # edge (webrtcAddress :8890)
